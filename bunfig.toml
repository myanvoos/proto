telemetry = false

[install]
minimumReleaseAge = 259200 # 3 days in seconds
minimumReleaseAgeExcludes = ["@types/bun", "bun-types", "kitty-vt-wasm"]
linker = "hoisted"
exact = true
saveTextLockfile = true

[loader]
".md" = "text"
".py" = "text"
".lark" = "text"

[test]
# bun test does NOT honor .gitignore; prune scratch dirs so a root-level
# `bun test` doesn't walk into them.
pathIgnorePatterns = [
  "**/node_modules/**",
  "**/.git/**",
  "**/target/**",
  "**/dist/**",
  "python/**",
  "docs/**",
  "runs/**",
  ".wt/**",
  ".worktrees/**",
]

[run]
bun = true
