


[filters.jq]
description = "Compact jq output — truncate large JSON results (exit 0 only)"
match_command = "^jq$"
strip_ansi = true
only_on_exit = [0]
keep_whole_up_to_bytes = 16384
strip_lines_matching = [
  "^\\s*$",
]
max_lines = 40
truncate_lines_at = 120

[[tests.jq]]
name = "short output passes through"
input = """
{
  "name": "test",
  "version": "1.0"
}
"""
expected = "{\n  \"name\": \"test\",\n  \"version\": \"1.0\"\n}\n"

[[tests.jq]]
name = "empty input passes through"
input = ""
expected = ""
