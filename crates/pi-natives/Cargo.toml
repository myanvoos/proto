[package]
name = "pi-natives"
version.workspace = true
edition.workspace = true
license = "MIT"
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true


[features]




default = []
wayland-pipewire = ["dep:pipewire"]

[dependencies]
anyhow.workspace = true
arboard.workspace = true
ast-grep-core.workspace = true
base64.workspace = true
globset.workspace = true
heapless.workspace = true
grep-matcher.workspace = true
futures.workspace = true
grep-pcre2.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
html-to-markdown-rs.workspace = true
icy_sixel.workspace = true
image = { workspace = true, features = ["bmp"] }

inferno.workspace = true
napi.workspace = true
napi-derive.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
pdf-inspector.workspace = true
phf.workspace = true
flume.workspace = true
pi-ast.workspace = true
pi-builtins.workspace = true
pi-iso.workspace = true
pi-shell.workspace = true
pi-walker.workspace = true
portable-pty.workspace = true
rayon.workspace = true
regex.workspace = true
smallvec.workspace = true
syntect.workspace = true
tokio.workspace = true
xutf.workspace = true
zstd.workspace = true
xxhash-rust.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
atspi = { version = "=0.30.0", features = ["tokio", "zbus"] }
pipewire = { version = "=0.10.1", optional = true }
reis = { version = "=0.7.1", features = ["tokio"] }
x11rb = { version = "=0.14.0", features = ["randr", "xinput", "xtest"] }
xkeysym = "=0.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
xcap = { version = "=0.9.8", default-features = false }
tempfile = "=3.27.0"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
foreign-types = "=0.5.0"
objc2-app-kit = "=0.3.2"
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
objc2-application-services = { version = "=0.3.2", default-features = true }
objc2-core-foundation = "=0.3.2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
xkeysym = "=0.2.1"

[build-dependencies]
napi-build.workspace = true
