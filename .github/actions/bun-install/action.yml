name: "bun install (shared cache)"
description: >
   Ensure bun is on PATH, then run `bun install --frozen-lockfile` with a shared
   package store. bun setup is skipped when the runner image satisfies the repository
   pin, and fetched on runners that lack it or ship a mismatched runtime
   (e.g. an older preloaded proto-kata image). Self-hosted proto-kata runners use the mounted Bun store
   PVC; GitHub-hosted runners use the stock actions/cache backend.

runs:
   using: composite
   steps:
      - name: Detect environment
        id: env
        shell: bash
        run: |
           # Reuse the runner runtime only when it satisfies the repository pin.
           want="$(sed -n 's/.*"packageManager": *"bun@\([^" ]*\)".*/\1/p' package.json)"
           if [ -z "$want" ]; then
             echo "::error::could not read Bun pin from package.json packageManager"
             exit 1
           fi
           case "$want" in
             '>='*) floor="${want#>=}"; install="" ;;
             *) floor="$want"; install="bun-v$want" ;;
           esac
           echo "bun_install=$install" >> "$GITHUB_OUTPUT"
           have=""
           if command -v bun >/dev/null 2>&1; then
             have="$(bun --version)"
           fi
           ok=false
           if [ -n "$have" ]; then
             if [ -z "$install" ]; then
               [ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -n1)" = "$floor" ] && ok=true
             elif [ "$have" = "$want" ]; then
               ok=true
             fi
           fi
           if [ "$ok" = true ]; then
             echo "setup_bun=false" >> "$GITHUB_OUTPUT"
             echo "bun present: $have (satisfies $want)"
           else
             echo "setup_bun=true" >> "$GITHUB_OUTPUT"
             echo "bun on runner: ${have:-none}; installing $want"
           fi
           # Infra detection keys "are we on can.internal infra?" off
           # $BAZEL_REMOTE_USER — a legacy-named secret that is envFrom-injected
           # into every proto-kata runner pod; only its presence is consulted.
           # RUNNER_ENVIRONMENT is empty on ARC pods, so it is not a usable
           # signal here. On infra, the ARC pod mounts the shared Bun store
           # at the default cache path; off infra, actions/cache restores it.
           if [ -n "${BAZEL_REMOTE_USER:-}" ]; then
             echo "cache=mounted" >> "$GITHUB_OUTPUT"
             echo "bun cache backend: mounted PVC (${BUN_INSTALL_CACHE_DIR:-${HOME}/.bun/install/cache})"
           else
             echo "cache=gha" >> "$GITHUB_OUTPUT"
             echo "bun cache backend: GitHub Actions cache"
           fi
      - name: Install pinned bun when missing or mismatched
        if: steps.env.outputs.setup_bun == 'true'
        shell: bash
        env:
           BUN_INSTALL_TAG: ${{ steps.env.outputs.bun_install }}
        run: |
           export BUN_INSTALL="${HOME}/.bun"
           if ! mkdir -p "${BUN_INSTALL}/bin" 2>/dev/null || [ ! -w "${BUN_INSTALL}/bin" ]; then
             export BUN_INSTALL="${RUNNER_TEMP:-/tmp}/bun"
             mkdir -p "${BUN_INSTALL}/bin"
           fi
           export BUN_INSTALL_CACHE_DIR="${BUN_INSTALL_CACHE_DIR:-${HOME}/.bun/install/cache}"
           echo "BUN_INSTALL=${BUN_INSTALL}" >> "$GITHUB_ENV"
           echo "BUN_INSTALL_CACHE_DIR=${BUN_INSTALL_CACHE_DIR}" >> "$GITHUB_ENV"
           # An empty tag requests latest when the repository declares a floor.
           curl -fsSL https://bun.sh/install | bash -s -- ${BUN_INSTALL_TAG}
           echo "${BUN_INSTALL}/bin" >> "$GITHUB_PATH"

      - name: Restore bun store (GitHub cache)
        id: bun-cache
        if: steps.env.outputs.cache == 'gha'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
           path: ~/.bun/install/cache
           key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
           restore-keys: |
              bun-${{ runner.os }}-

      - name: Prepare mounted bun store
        if: steps.env.outputs.cache == 'mounted'
        shell: bash
        run: mkdir -p "${BUN_INSTALL_CACHE_DIR:-${HOME}/.bun/install/cache}"

      - name: Install dependencies
        shell: bash
        run: |
           # The shared bun store (mounted PVC on proto-kata, actions/cache
           # elsewhere) can hand a job a corrupt or partially written tarball
           # when parallel jobs touch the same cache entry, so `bun install`
           # aborts with `Fail extracting tarball for "<pkg>"`. That blob is
           # content-hash-named, not derivable from the package name, so we
           # can't evict just the bad entry — instead retry the install against
           # a fresh job-local cache dir, forcing a clean re-download without
           # mutating the shared store other concurrent jobs rely on. The warm
           # shared cache stays the fast path; the cold retry only runs on the
           # rare corruption (also covers a transient network blip on attempt 1).
           if bun install --frozen-lockfile; then
             exit 0
           fi
           echo "::warning title=bun install retry::shared bun store install failed; retrying with a clean job-local cache"
           retry_cache="$(mktemp -d "${RUNNER_TEMP:-/tmp}/bun-cache-retry.XXXXXX")"
           bun install --frozen-lockfile --cache-dir="$retry_cache"

      - name: Save bun store (GitHub cache)
        if: steps.env.outputs.cache == 'gha' && github.event_name != 'pull_request' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
           path: ~/.bun/install/cache
           key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
