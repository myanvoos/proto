name: "Install native addon artifacts"
description: >
   Downloads the native addons built once by the native_addons job and copies
   the requested targets into place without rebuilding.

inputs:
   targets:
      description: Space-separated scripts/build-natives.sh target names
      required: true
   dest:
      description: Destination directory for the .node files
      required: false
      default: packages/natives/native

runs:
   using: composite
   steps:
      - name: Download native addon artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
           name: native-addons
           path: ${{ runner.temp }}/proto-native-artifacts

      - name: Install native addon targets
        shell: bash
        env:
           NATIVE_TARGETS: ${{ inputs.targets }}
           NATIVE_DEST: ${{ inputs.dest }}
        run: |
           set -euo pipefail
           src_dir="$RUNNER_TEMP/proto-native-artifacts"
           mkdir -p "$NATIVE_DEST"
           installed=""
           for target in $NATIVE_TARGETS; do
              # Canonical loader filename per target. Musl addons SHIP under the
              # plain linux-<arch> names (the runtime loader never sees gnu and
              # musl side by side); the flat artifact dir stores them under
              # their musl-explicit target names so both libcs can sit in one
              # directory, and this loop renames back to canonical at install.
              case $target in
                 linux-x64-baseline)      canonical=pi_natives.linux-x64-baseline.node ;;
                 linux-x64-modern)        canonical=pi_natives.linux-x64-modern.node ;;
                 linux-arm64)             canonical=pi_natives.linux-arm64.node ;;
                 linux-musl-x64-baseline) canonical=pi_natives.linux-x64-baseline.node ;;
                 linux-musl-arm64)        canonical=pi_natives.linux-arm64.node ;;
                 darwin-x64-baseline)     canonical=pi_natives.darwin-x64-baseline.node ;;
                 darwin-arm64)            canonical=pi_natives.darwin-arm64.node ;;
                 *)
                    echo "::error::Unknown native addon target '$target'"
                    exit 1
                    ;;
              esac
              if [ -f "$src_dir/pi_natives.$target.node" ]; then
                 src_file="$src_dir/pi_natives.$target.node"
              elif [ -f "$src_dir/$canonical" ]; then
                 # Canonical-name source (packages/natives/native, npm tarballs).
                 src_file="$src_dir/$canonical"
              else
                 echo "::error::No addon for target '$target': expected pi_natives.$target.node or $canonical under $src_dir"
                 exit 1
              fi
              dst_file="$NATIVE_DEST/$canonical"
              if [ "$src_file" -ef "$dst_file" ]; then
                 continue
              fi
              # gnu and musl targets share canonical basenames; installing both
              # in one invocation would silently let the last win.
              case " $installed " in
                 *" $canonical "*)
                    echo "::error::Targets '$target' and an earlier target both map to $canonical (gnu/musl share canonical filenames); install them in separate invocations"
                    exit 1
                    ;;
              esac
              installed="$installed $canonical"
              cp "$src_file" "$dst_file"
              echo "installed $dst_file"
           done
