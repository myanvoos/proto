name: CI

on:
   push:
      branches: [main]
      paths:
         - "packages/**"
         - "crates/**"
         - "scripts/**"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         - ".github/**"
   pull_request:
      branches: [main]
      paths:
         - "packages/**"
         - "crates/**"
         - "scripts/**"
         - "Cargo.toml"
         - "Cargo.lock"
         - "deny.toml"
         - "about.toml"
         - "LICENSE"
         - "THIRD-PARTY-NOTICES.txt"
         - "rust-toolchain.toml"
         - "rustfmt.toml"
         - "bun.lock"
         - "bunfig.toml"
         - "package.json"
         - "patches/**"
         - ".github/**"
   workflow_dispatch:

concurrency:
   group: "${{ github.workflow }}-${{ (startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && format('release-{0}', github.sha) || github.ref }}"
   cancel-in-progress: "${{ !(startsWith(github.event.head_commit.message, 'chore: bump version to ') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}"

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
   contents: read

jobs:
   release_metadata:
      name: Resolve release metadata
      runs-on: ubuntu-22.04
      outputs:
         is-release: ${{ steps.detect.outputs.is-release }}
         release-tag: ${{ steps.detect.outputs.release-tag }}
      steps:
         - uses: actions/checkout@v4
           with:
              fetch-tags: ${{ github.ref == 'refs/heads/main' }}
         - name: Detect release tag at HEAD
           id: detect
           shell: bash
           run: |
              is_release=false
              release_tag=""
              case "${{ github.ref }}" in
                refs/tags/v[0-9]*)
                  release_tag="${{ github.ref_name }}"
                  ;;
                refs/heads/main)
                  if [ "${{ github.event_name }}" != "pull_request" ]; then
                    release_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -n1 || true)
                  fi
                  ;;
              esac
              if [ -n "$release_tag" ]; then
                echo "HEAD carries release tag $release_tag; this run builds and publishes the release."
                is_release=true
              fi
              {
                echo "is-release=$is_release"
                echo "release-tag=$release_tag"
              } >> "$GITHUB_OUTPUT"

   check:
      name: Lint, type check
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Verify Rust license compliance (cargo-deny 0.20.2)
           run: |
              cargo install --locked --version 0.20.2 cargo-deny
              # `--offline` needs every workspace crate already in the registry
              # cache. Every run lands on a fresh GitHub-hosted runner, where the
              # only prior cargo work is the cargo-deny install, so nothing
              # populates the index for our own graph and resolution fails.
              # Fetch first.
              cargo fetch --locked
              cargo deny --locked --offline check licenses sources
         - name: Type check workspace
           run: bun run ci:check:full

   rust_validate:
      name: Validate Rust workspace
      if: github.event_name != 'pull_request'
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - name: Cache cargo registry and target dir
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
           with:
              path: |
                 ~/.cargo/registry
                 ~/.cargo/git
                 target
              key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
              restore-keys: cargo-${{ runner.os }}-
         - name: Clippy
           run: cargo clippy --workspace --exclude brush-core --no-deps -- -D warnings
         - name: Rustfmt
           run: cargo fmt --all --check

   native_addons:
      name: "Build native addons: ${{ matrix.arch }}"
      if: github.event_name != 'pull_request'
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    arch: x64,
                    os: ubuntu-22.04,
                    targets: linux-musl-x64-baseline linux-x64-baseline linux-x64-modern,
                 }
               - { arch: arm64, os: ubuntu-24.04-arm, targets: linux-arm64 linux-musl-arm64 }
      runs-on: ${{ matrix.os }}
      steps:
         - uses: actions/checkout@v4
         - name: Install musl toolchain
           shell: bash
           run: |
              set -euo pipefail
              # build-natives.sh wires musl-gcc in as CC_<triple> and the musl target's linker
              # for ring/cc-rs; stock runner images do not ship it.
              sudo apt-get update
              sudo apt-get install -y musl-tools
         - name: Build native addons
           shell: bash
           run: |
              set -eo pipefail
              # Split by host architecture: build-natives.sh compiles for the
              # matching host only (no cross toolchains), so each arch builds on
              # its own runner and release_binary merges both artifacts.
              #
              # Sequential by design: each addon link peaks at several GiB of
              # rustc RSS, and concurrent links OOM'd the build host back when
              # all targets built at once (runs 30556752623 / 30557524371).
              # The script builds strictly one target at a time; the flat
              # artifact dir stores musl addons under their musl-explicit
              # names so gnu and musl outputs cannot clobber each other
              # (native-artifacts renames at install time).
              sh scripts/build-natives.sh ${{ matrix.targets }} \
                 --dest "$RUNNER_TEMP/native-addons"
         - name: Upload native addon artifacts
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           with:
              name: native-addons-${{ matrix.arch }}
              path: ${{ runner.temp }}/native-addons/*.node
              if-no-files-found: error
              retention-days: 1

   native_addons_pr:
      name: Smoke release native addons
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - name: Fetch release native addons (npm)
           shell: bash
           run: |
              set -euo pipefail
              tarball="$(npm view @oh-my-pi/pi-natives-linux-x64@latest dist.tarball)"
              echo "Fetching $tarball"
              curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP"
              mkdir -p "$RUNNER_TEMP/native-addons"
              cp "$RUNNER_TEMP/package/pi_natives.linux-x64-baseline.node" \
                 "$RUNNER_TEMP/package/pi_natives.linux-x64-modern.node" \
                 "$RUNNER_TEMP/native-addons/"
         - name: Smoke release addons
           shell: bash
           run: |
              set -euo pipefail
              # NOTE: `bun -e 'require("./x.node")'` swallows dlopen failures
              # (exit 0 on a bogus addon); a script file enforces them in
              # both bun and node. Verified against a corrupt .node fixture.
              cat > "$RUNNER_TEMP/smoke-addons.js" <<'EOF'
              for (const f of process.argv.slice(2)) {
               const m = require(f);
               if (!m || Object.keys(m).length === 0) {
               	console.error(`addon failed to load: ${f}`);
               	process.exit(1);
               }
              }
              EOF
              loader=node
              if command -v bun >/dev/null 2>&1; then loader=bun; fi
              "$loader" "$RUNNER_TEMP/smoke-addons.js" \
                "$RUNNER_TEMP/native-addons/pi_natives.linux-x64-baseline.node" \
                "$RUNNER_TEMP/native-addons/pi_natives.linux-x64-modern.node"
         - name: Note native changes tested against release addons
           shell: bash
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              if gh pr diff ${{ github.event.pull_request.number }} --name-only 2>/dev/null \
                 | grep -qE '^(crates/|Cargo\.(toml|lock)|rust-toolchain\.toml|rustfmt\.toml|scripts/build-natives\.sh)'; then
                echo "::notice title=Native sources changed::PR CI tests against the latest release addons by design; native changes are validated post-merge on main and at release."
              fi

   release_gate:
      name: Release validation gate
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.rust_validate.result == 'success' &&
         needs.native_addons.result == 'success' &&
         needs.check.result == 'success' }}
      needs: [release_metadata, check, rust_validate, native_addons]
      runs-on: ubuntu-22.04
      steps:
         - uses: actions/checkout@v4
         - uses: ./.github/actions/bun-install
         - run: echo "release validation green"

   release_binary:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.native_addons.result == 'success' }}
      needs: [release_metadata, native_addons]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    arch: x64,
                    target_id: linux-x64,
                    binary_path: packages/coding-agent/binaries/proto-linux-x64,
                    native_targets: linux-x64-baseline linux-x64-modern,
                 }
               - {
                    os: ubuntu-22.04,
                    platform: linux,
                    libc: musl,
                    arch: x64,
                    target_id: linux-musl-x64,
                    binary_path: packages/coding-agent/binaries/proto-linux-musl-x64,
                    native_targets: linux-musl-x64-baseline,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    arch: arm64,
                    target_id: linux-arm64,
                    binary_path: packages/coding-agent/binaries/proto-linux-arm64,
                    native_targets: linux-arm64,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    platform: linux,
                    libc: musl,
                    arch: arm64,
                    target_id: linux-musl-arm64,
                    binary_path: packages/coding-agent/binaries/proto-linux-musl-arm64,
                    native_targets: linux-musl-arm64,
                 }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
           with:
              bun-version: "1.4"
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Install prebuilt native addon(s)
           uses: ./.github/actions/native-artifacts
           with:
              targets: ${{ matrix.native_targets }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Smoke release binary
           if: matrix.libc != 'musl'
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
         - name: Smoke musl release binary on Alpine
           if: matrix.libc == 'musl'
           run: |
              binary="$(realpath "${{ matrix.binary_path }}")"
              # Bun's musl-target binaries link libstdc++/libgcc dynamically;
              # Alpine users install them alongside the binary (same as bun itself).
              docker run --rm -v "$binary:/usr/local/bin/proto:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" proto --version
              '
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           with:
              name: proto-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}

   release_binary_darwin:
      name: "Release binary: ${{ matrix.target_id }}"
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() }}
      needs: [release_metadata]
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: macos-15-intel,
                    target_id: darwin-x64,
                    binary_path: packages/coding-agent/binaries/proto-darwin-x64,
                    native_targets: darwin-x64-baseline,
                 }
               - {
                    os: macos-14,
                    target_id: darwin-arm64,
                    binary_path: packages/coding-agent/binaries/proto-darwin-arm64,
                    native_targets: darwin-arm64,
                 }
      runs-on: ${{ matrix.os }}
      permissions:
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
           with:
              bun-version: "1.4"
         - name: Cache bun dependencies
           uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
           with:
              path: ~/.bun/install/cache
              key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
         - run: bun install --frozen-lockfile
         - name: Build native addon
           run: sh scripts/build-natives.sh ${{ matrix.native_targets }} --dest packages/natives/native
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Sign and notarize macOS binary (Developer ID)
           if: env.MACOS_SIGNING == 'true'
           env:
              APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
              APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
              APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary_path }}"
         - name: Smoke release binary
           run: |
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
         - name: Upload release binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
           with:
              name: proto-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}

   release_github:
      name: Publish GitHub release
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_gate.result == 'success' &&
         needs.release_binary.result == 'success' &&
         needs.release_binary_darwin.result == 'success' }}
      needs: [release_metadata, release_gate, release_binary, release_binary_darwin]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
           with:
              bun-version: "1.4"
         - name: Generate release notes from CHANGELOGs
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: bun scripts/ci-release-notes.ts ${{ needs.release_metadata.outputs.release-tag }}
         - name: Download release binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
           with:
              pattern: proto-binary-*
              path: packages/coding-agent/binaries
              merge-multiple: true
         - name: Build browser relay artifacts
           run: bun run --cwd packages/browser-relay build
         - name: Generate checksums
           run: |
              bun run ci:release:checksums SHA256SUMS.txt \
                packages/coding-agent/binaries/proto-* \
                packages/browser-relay/dist/proto-browser-relay-extension.zip \
                LICENSE \
                THIRD-PARTY-NOTICES.txt
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
           with:
              tag_name: ${{ needs.release_metadata.outputs.release-tag }}
              files: |
                 packages/coding-agent/binaries/proto-*
                 packages/browser-relay/dist/proto-browser-relay-extension.zip
                 LICENSE
                 THIRD-PARTY-NOTICES.txt
                 SHA256SUMS.txt
              body_path: release-notes.md
              generate_release_notes: true

   release_github_verify:
      name: Verify published release (macOS)
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github.result == 'success' }}
      needs: [release_metadata, release_github]
      runs-on: macos-14
      permissions:
         contents: read
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - name: Download published macOS arm64 binary
           run: |
              curl -fsSL -o proto-darwin-arm64 "https://github.com/${{ github.repository }}/releases/download/${{ needs.release_metadata.outputs.release-tag }}/proto-darwin-arm64"
              chmod +x proto-darwin-arm64
         - name: Verify published macOS arm64 binary
           run: |
              codesign -dvvv ./proto-darwin-arm64
              codesign --verify --strict --verbose=4 ./proto-darwin-arm64
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" ./proto-darwin-arm64 --version
         - name: Assert signed release is not ad-hoc
           if: env.MACOS_SIGNING == 'true'
           run: |
              if codesign -dvvv ./proto-darwin-arm64 2>&1 | grep -qE "flags=.*adhoc|Signature=adhoc"; then
                echo "published binary is still ad-hoc signed (Developer ID signing did not run)" >&2
                exit 1
              fi
              # Gatekeeper assessment: a notarized Developer ID binary is accepted.
              # Informational — a bare (unstapled) Mach-O relies on the online ticket
              # lookup, so surface the result without gating the release on it.
              spctl -a -t exec -vv ./proto-darwin-arm64 || echo "spctl non-zero (expected for unstapled bare binary; ticket served online)"

   release_brew:
      name: Update Homebrew tap
      if: ${{ needs.release_metadata.outputs.is-release == 'true' && !cancelled() &&
         needs.release_github_verify.result == 'success' }}
      needs: [release_metadata, release_github_verify]
      runs-on: ubuntu-22.04
      env:
         HAS_TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
           if: env.HAS_TAP_KEY == 'true'
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
           if: env.HAS_TAP_KEY == 'true'
           with:
              bun-version: "1.4"
         - name: Check out the Homebrew tap
           if: env.HAS_TAP_KEY == 'true'
           uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
           with:
              repository: myanvoos/homebrew-tap
              ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
              path: homebrew-tap
         - name: Regenerate and push the formula
           if: env.HAS_TAP_KEY == 'true'
           env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
           run: |
              bun scripts/ci-update-brew-formula.ts "${{ needs.release_metadata.outputs.release-tag }}" --out homebrew-tap/Formula/proto.rb
              cd homebrew-tap
              if git diff --quiet -- Formula/proto.rb; then
                echo "formula already up to date for ${{ needs.release_metadata.outputs.release-tag }}"
                exit 0
              fi
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "proto ${{ needs.release_metadata.outputs.release-tag }}" -- Formula/proto.rb
              git push origin HEAD:main
