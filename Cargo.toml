[workspace]




members = [
   "crates/pi-ast",
   "crates/pi-builtins",
   "crates/pi-iso",
   "crates/pi-natives",
   "crates/pi-shell",
   "crates/pi-walker",
   "crates/vendor/brush-core",
]
resolver = "3"

[workspace.package]
version = "18.0.4"
edition = "2024"
license = "MIT"
authors = ["Stencil Labs, Inc."]
homepage = "https://github.com/myanvoos/proto"
repository = "https://github.com/myanvoos/proto"

[patch.crates-io]
brush-core = { path = "crates/vendor/brush-core" }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true












panic = "unwind"

[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = false
strip = "symbols"


split-debuginfo = "off"

[profile.local]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
strip = false



[profile.profiling]
inherits = "release"
debug = "line-tables-only"
split-debuginfo = "unpacked"
strip = false

[profile.dev]
opt-level = 0
lto = false
codegen-units = 256
incremental = true
debug = "line-tables-only"






split-debuginfo = "unpacked"


[profile.dev.package."*"]
opt-level = 2
debug = false

[workspace.lints.rust]



mismatched_lifetime_syntaxes = "allow"

[workspace.lints.clippy]



all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }




allow_attributes_without_reason = "warn" 




borrow_as_ptr = "allow"
cast_ptr_alignment = "allow"
ptr_as_ptr = "allow"
ref_as_ptr = "allow"
undocumented_unsafe_blocks = "allow"
unsafe_derive_deserialize = "allow"




cast_lossless = "allow"            
cast_possible_truncation = "allow" 
cast_possible_wrap = "allow"       
cast_precision_loss = "allow"      
cast_sign_loss = "allow"           
tuple_array_conversions = "allow"  




float_cmp = "allow" 




inline_always = "allow"                      
must_use_candidate = "allow"                 
needless_pass_by_value = "allow"
redundant_closure_for_method_calls = "allow" 
return_self_not_must_use = "allow"           




inconsistent_struct_constructor = "allow"
missing_fields_in_debug = "allow"         
struct_excessive_bools = "allow"          




match_same_arms = "allow"                    
match_wildcard_for_single_variants = "allow" 
option_if_let_else = "allow"                 




enum_glob_use = "allow"
items_after_statements = "allow" 
wildcard_imports = "allow"       
redundant_pub_crate = "allow"




let_underscore_untyped = "allow" 
similar_names = "allow"          




unreadable_literal = "allow" 
verbose_bit_mask = "allow"   




default_trait_access = "allow"        
significant_drop_tightening = "allow" 




missing_errors_doc = "allow" 
missing_panics_doc = "allow" 




too_many_arguments = "allow" 
too_many_lines = "allow"     

[workspace.dependencies]




pi-ast = { path = "crates/pi-ast" }
pi-iso = { path = "crates/pi-iso" }
pi-shell = { path = "crates/pi-shell" }
pi-walker = { path = "crates/pi-walker" }
brush-core = { path = "crates/vendor/brush-core" }
pi-builtins = { path = "crates/pi-builtins" }




async-trait = "0.1"
futures = "0.3"
dashmap = "6.1"
parking_lot = "0.12.5"
rayon = "1.12"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
flume = "0.11"




base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml = "1.1"




anyhow = "1.0"
bytes = "1"




clap = { version = "4", features = ["derive"] }




pdf-inspector = "1"
regex = "1"
similar = "3.1.0"




phf = { version = "0.13", features = ["macros"] }
heapless = "0.9"
smallvec = { version = "1.15.1", features = [
   "serde",
   "write",
   "union",
   "const_new",
] }




xxhash-rust = { version = "0.8", features = ["xxh64"] }




libc = "0.2"
os_pipe = "1"




napi = { version = "3", features = ["napi10", "tokio_rt", "tokio_time"] }
napi-build = "2"
napi-derive = "3"




arboard = { version = "3.6.1", features = ["wayland-data-control"] }
icy_sixel = "0.5"
portable-pty = "0.9"




globset = "0.4"
grep-matcher = "0.1"
grep-pcre2 = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"




image = { version = "0.25", default-features = false, features = [
   "png",
   "jpeg",
   "gif",
   "webp",
] }



zune-jpeg = { version = "0.5", default-features = false, features = ["log"] }
png = "0.18"
inferno = { version = "0.12", default-features = false }
syntect = { version = "5.3", default-features = false, features = [
   "default-syntaxes",
   "default-themes",
   "regex-fancy",
   "yaml-load",
] }




html-to-markdown-rs = { version = "3.9.2", default-features = false }




xutf = "1.4"
zstd = "0.13"
fancy-regex = "0.16"
tiktoken-rs = "0.11"




brush-parser = "0.3"




ast-grep-core = { version = "0.39", default-features = false, features = [
   "tree-sitter",
] }
tree-sitter = "0.25"
tree-sitter-astro = { version = "0.1.1", package = "tree-sitter-astro-next" }
